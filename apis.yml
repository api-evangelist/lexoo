apis:
  - aid: lexoo:wordpress-rest-api
    name: Lexoo WordPress REST API
    description: >-
      The Lexoo website is built on WordPress and exposes the standard WordPress
      REST API at /wp-json/, serving JSON representations of the site's pages,
      media, taxonomies and settings. The live discovery document advertises the
      wp/v2 namespace alongside plugin namespaces, and the site currently
      publishes eleven pages and no posts. This is an incidental content API
      surfaced by the CMS rather than a product API offered by Lexoo.
    humanURL: https://developer.wordpress.org/rest-api/
    baseURL: https://lexoo.com/wp-json/wp/v2
    tags:
      - Content
      - JSON
      - REST
      - WordPress
    properties:
      - type: Documentation
        url: https://developer.wordpress.org/rest-api/
      - type: DiscoveryDocument
        url: https://lexoo.com/wp-json/
  - aid: lexoo:rss-feed
    name: Lexoo RSS Feed
    description: >-
      Lexoo's WordPress site publishes a standard RSS 2.0 feed at /feed/ for its
      main content stream. The feed is well-formed and reachable but currently
      carries no items, because the site publishes pages only and has no blog
      posts.
    humanURL: https://lexoo.com/feed/
    baseURL: https://lexoo.com
    tags:
      - Feed
      - RSS
      - Syndication
    properties:
      - type: RSSFeed
        url: https://lexoo.com/feed/
